<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Participants Check-in</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root { --bg:#f4f7fb; --card:#fff; --text:#172033; --muted:#667085; --border:#e4e7ec; --primary:#155eef; --red:#b42318; --success:#079455; }
    * { box-sizing:border-box; }
    [hidden] { display:none !important; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:Arial,sans-serif; }
    button,input { font:inherit; }
    .shell { max-width:920px; margin:auto; padding:18px; }
    .event-header { display:grid; grid-template-columns:120px 1fr 210px; align-items:center; gap:16px; padding:16px; border:1px solid #fecaca; border-top:6px solid #d92d20; border-radius:17px; background:#fff; text-align:center; }
    .event-header img { max-width:100%; max-height:110px; object-fit:contain; }
    .heading div { font-weight:900; line-height:1.25; text-transform:uppercase; }
    .heading .primary,.heading .date { color:var(--red); font-size:clamp(18px,2.6vw,27px); }
    .heading .secondary { margin-top:5px; font-size:clamp(17px,2.3vw,23px); }
    .heading .tertiary { margin-top:4px; font-size:clamp(15px,2vw,20px); }
    h1 { margin:22px 0 16px; text-align:center; font-size:clamp(28px,5vw,42px); }
    .panel { background:var(--card); border:1px solid var(--border); border-radius:17px; padding:20px; box-shadow:0 12px 34px rgba(16,24,40,.1); }
    .mode-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    .mode-card { border:1px solid var(--border); border-radius:15px; padding:17px; }
    .mode-card h2 { margin:0 0 12px; font-size:22px; }
    .field { width:100%; min-height:60px; border:2px solid var(--border); border-radius:12px; padding:12px 15px; font-size:22px; font-weight:800; text-transform:uppercase; }
    .btn { width:100%; min-height:60px; margin-top:11px; border:0; border-radius:12px; background:var(--primary); color:#fff; font-weight:900; cursor:pointer; }
    .btn.secondary { background:#fff; color:var(--text); border:1px solid var(--border); }
    #reader { width:100%; overflow:hidden; border-radius:12px; }
    .status { margin-top:15px; padding:12px; border-radius:10px; background:#f9fafb; color:var(--muted); text-align:center; font-weight:700; }
    .participant { margin-top:18px; padding:18px; border:2px solid #84caff; border-radius:15px; background:#eff8ff; }
    .participant.checked { border-color:#f04438; background:#fff1f0; }
    .participant-name { margin:0; font-size:clamp(27px,5vw,38px); }
    .participant-meta { margin-top:8px; line-height:1.6; }
    .badge { display:inline-block; margin-top:10px; padding:7px 11px; border-radius:999px; font-weight:900; background:#fff8db; color:#9a6700; }
    .participant.checked .badge { background:#fee4e2; color:#b42318; }
    .family { display:grid; gap:9px; margin-top:15px; }
    .family label { display:flex; gap:12px; align-items:center; min-height:56px; padding:11px; border:1px solid var(--border); border-radius:10px; background:#fff; font-weight:800; }
    .family input { width:26px; height:26px; }
    .checkin { min-height:70px; font-size:24px; background:var(--success); }
    .checkin:disabled { opacity:.65; cursor:not-allowed; }
    .popup { position:fixed; inset:0; display:grid; place-items:center; z-index:100; padding:20px; text-align:center; background:rgba(7,148,85,.97); color:#fff; }
    .popup.error { background:rgba(217,45,32,.97); }
    .popup h2 { font-size:clamp(38px,8vw,72px); margin:0 0 14px; }
    .popup p { font-size:clamp(25px,5vw,42px); font-weight:900; margin:0; }
    .popup button { min-width:200px; min-height:58px; margin-top:25px; border:0; border-radius:12px; font-weight:900; }
    @media (max-width:720px) {
      .shell { padding:10px; }
      .event-header { grid-template-columns:80px 1fr 125px; gap:8px; padding:10px; }
      .event-header img { max-height:78px; }
      .mode-grid { grid-template-columns:1fr; }
      .panel { padding:13px; }
    }
    @media (max-width:480px) {
      .event-header { grid-template-columns:75px 1fr; grid-template-areas:"kbri hut" "heading heading"; }
      .kbri { grid-area:kbri; } .hut { grid-area:hut; } .heading { grid-area:heading; }
      .heading .primary,.heading .date { font-size:17px; }
      .heading .secondary { font-size:16px; }
      .heading .tertiary { font-size:14px; }
    }
  </style>
</head>

    <h1>PARTICIPANTS CHECK-IN</h1>
    <section class="panel">
      <div class="mode-grid">
        <section class="mode-card">
          <h2>SCAN QR CODE</h2>
          <div id="reader"></div>
          <button id="startScanner" class="btn" type="button">START QR SCANNER</button>
          <button id="stopScanner" class="btn secondary" type="button" hidden>STOP SCANNER</button>
        </section>
        <section class="mode-card">
          <h2>INPUT PARTICIPANT ID</h2>
          <input id="participantId" class="field" type="text" inputmode="numeric" autocomplete="off" placeholder="PARTICIPANT ID" maxlength="24">
          <button id="findParticipant" class="btn" type="button">FIND PARTICIPANT</button>
        </section>
      </div>
      <div id="status" class="status">Scan a QR Code or enter a Participant ID.</div>
      <section id="participantCard" class="participant" hidden>
        <h2 id="participantName" class="participant-name"></h2>
        <div id="participantMeta" class="participant-meta"></div>
        <span id="participantStatus" class="badge"></span>
        <div id="familyList" class="family"></div>
        <button id="checkIn" class="btn checkin" type="button">CHECK IN</button>
      </section>
    </section>
  </main>
  <div id="popup" class="popup" hidden>
    <div><h2 id="popupTitle"></h2><p id="popupMessage"></p><button id="closePopup" type="button">CLOSE</button></div>
  </div>
  <script>
    // REQUIRED: replace this value with the deployed Google Apps Script web app URL.
    const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbz0QKnCmiB0GEuHGspWmtdblh_I-_K_2tmWG9GI1VCBpenQAXhozOAj0UaB6f2yeieb/exec';
    const LIVE_REFRESH_MS = 5000;
    let selectedParticipant = null;
    let scanner = null;
    let scannerRunning = false;
    let requestInFlight = false;

    const idInput = document.getElementById('participantId');
    const card = document.getElementById('participantCard');
    const checkInButton = document.getElementById('checkIn');

    document.getElementById('startScanner').addEventListener('click', startScanner);
    document.getElementById('stopScanner').addEventListener('click', stopScanner);
    document.getElementById('findParticipant').addEventListener('click', () => lookupParticipant(idInput.value, false));
    document.getElementById('closePopup').addEventListener('click', resetAfterPopup);
    idInput.addEventListener('keydown', event => { if (event.key === 'Enter') lookupParticipant(idInput.value, false); });
    setInterval(() => {
      if (!document.hidden && selectedParticipant && !requestInFlight) {
        lookupParticipant(selectedParticipant.participantId, true);
      }
    }, LIVE_REFRESH_MS);

    function ensureConfigured() {
      if (!/^https:\/\/script\.google\.com\/macros\/s\//.test(GAS_WEB_APP_URL)) {
        showStatus('Set GAS_WEB_APP_URL in this HTML file before publishing it on GitHub.', true);
        return false;
      }
      return true;
    }

    function jsonp(params) {
      return new Promise((resolve, reject) => {
        if (!ensureConfigured()) return reject(new Error('Web app URL is not configured.'));
        const callbackName = '__hutriCallback' + Date.now() + Math.floor(Math.random() * 100000);
        const script = document.createElement('script');
        const timer = setTimeout(() => cleanup(new Error('Request timed out.')), 15000);
        function cleanup(error, value) {
          clearTimeout(timer);
          delete window[callbackName];
          script.remove();
          error ? reject(error) : resolve(value);
        }
        window[callbackName] = value => cleanup(null, value);
        const query = new URLSearchParams(Object.assign({}, params, { callback: callbackName, _: Date.now() }));
        script.src = GAS_WEB_APP_URL + (GAS_WEB_APP_URL.includes('?') ? '&' : '?') + query.toString();
        script.onerror = () => cleanup(new Error('Unable to connect to the registration database.'));
        document.head.appendChild(script);
      });
    }

    async function startScanner() {
      if (!ensureConfigured() || scannerRunning) return;
      if (typeof Html5Qrcode === 'undefined') {
        showStatus('QR scanner library could not be loaded.', true);
        return;
      }
      scanner = scanner || new Html5Qrcode('reader');
      try {
        await scanner.start(
          { facingMode: 'environment' },
          { fps: 10, qrbox: { width: 240, height: 240 }, formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE] },
          decodedText => {
            const id = extractParticipantId(decodedText);
            if (!id) return showStatus('The scanned QR Code does not contain a valid Participant ID.', true);
            idInput.value = id;
            stopScanner();
            lookupParticipant(id, false);
          },
          () => {}
        );
        scannerRunning = true;
        document.getElementById('startScanner').hidden = true;
        document.getElementById('stopScanner').hidden = false;
        showStatus('QR scanner is active. Point the camera at the participant QR Code.');
      } catch (error) {
        showStatus(error && error.message ? error.message : 'Camera could not be started.', true);
      }
    }

    async function stopScanner() {
      if (!scanner || !scannerRunning) return;
      try { await scanner.stop(); } catch (ignored) {}
      scannerRunning = false;
      document.getElementById('startScanner').hidden = false;
      document.getElementById('stopScanner').hidden = true;
    }

    function extractParticipantId(value) {
      const text = String(value || '').trim().toUpperCase();
      try {
        const url = new URL(text);
        const fromUrl = url.searchParams.get('participantId') || url.searchParams.get('id');
        if (fromUrl) return sanitizeId(fromUrl);
      } catch (ignored) {}
      return sanitizeId(text.replace(/^HUTRI81:/, ''));
    }

    function sanitizeId(value) {
      return String(value || '').toUpperCase().replace(/[^A-Z0-9-]/g, '').slice(0, 24);
    }

    async function lookupParticipant(value, silent) {
      const id = extractParticipantId(value);
      if (!id || requestInFlight) return;
      requestInFlight = true;
      if (!silent) showStatus('Loading participant data…');
      try {
        const result = await jsonp({ api: 'participant', participantId: id });
        if (!result || !result.success || !result.participant) {
          throw new Error(result && result.error ? result.error : 'Participant ID was not found.');
        }
        selectedParticipant = result.participant;
        idInput.value = selectedParticipant.participantId;
        renderParticipant(selectedParticipant);
        if (!silent) showStatus('Participant data loaded. Live update is active.');
      } catch (error) {
        if (!silent) {
          selectedParticipant = null;
          card.hidden = true;
          showStatus(error && error.message ? error.message : 'Participant ID was not found.', true);
        }
      } finally {
        requestInFlight = false;
      }
    }

    function renderParticipant(person) {
      const checked = Boolean(person.checkedIn);
      card.classList.toggle('checked', checked);
      document.getElementById('participantName').textContent = person.name;
      document.getElementById('participantMeta').textContent = [
        'Participant ID: ' + person.participantId,
        person.mobile,
        person.city,
        person.categoryDisplay
      ].filter(value => value && value !== '—').join(' · ');
      document.getElementById('participantStatus').textContent = checked ? 'ALREADY CHECKED-IN' : 'NOT CHECKED-IN';
      const familyList = document.getElementById('familyList');
      familyList.replaceChildren();
      const attending = new Set((person.attendingFamilyList || []).map(normalize));
      if (!person.familyList || !person.familyList.length) {
        const none = document.createElement('div');
        none.textContent = 'No family members registered.';
        familyList.appendChild(none);
      } else {
        person.familyList.forEach((member, index) => {
          const label = document.createElement('label');
          const input = document.createElement('input');
          input.type = 'checkbox';
          input.value = member;
          input.checked = checked && attending.has(normalize(member));
          input.disabled = checked;
          const text = document.createElement('span');
          text.textContent = member;
          label.append(input, text);
          familyList.appendChild(label);
        });
      }
      checkInButton.disabled = checked;
      checkInButton.textContent = checked
        ? 'THIS PARTICIPANT HAS ALREADY CHECKED IN'
        : 'CHECK IN';
      card.hidden = false;
    }

    checkInButton.addEventListener('click', async () => {
      if (!selectedParticipant || selectedParticipant.checkedIn || requestInFlight) return;
      requestInFlight = true;
      checkInButton.disabled = true;
      checkInButton.textContent = 'SAVING…';
      const family = Array.from(document.querySelectorAll('#familyList input:checked')).map(input => input.value);
      try {
        const result = await jsonp({
          api: 'checkin',
          participantId: selectedParticipant.participantId,
          family: JSON.stringify(family)
        });
        if (result && result.duplicate) {
          selectedParticipant = result.participant || selectedParticipant;
          renderParticipant(selectedParticipant);
          showPopup('ALREADY CHECKED-IN', selectedParticipant.name, true);
          return;
        }
        if (!result || !result.success) throw new Error(result && result.error ? result.error : 'Check-in could not be completed.');
        selectedParticipant = result.participant;
        renderParticipant(selectedParticipant);
        showPopup('CHECK-IN SUCCESS', selectedParticipant.name, false);
      } catch (error) {
        checkInButton.disabled = false;
        checkInButton.textContent = 'CHECK IN';
        showPopup('ERROR', error && error.message ? error.message : 'Check-in could not be completed.', true);
      } finally {
        requestInFlight = false;
      }
    });

    function showStatus(message, error) {
      const status = document.getElementById('status');
      status.textContent = message;
      status.style.color = error ? '#b42318' : '';
    }

    function showPopup(title, message, error) {
      const popup = document.getElementById('popup');
      popup.className = 'popup' + (error ? ' error' : '');
      document.getElementById('popupTitle').textContent = title;
      document.getElementById('popupMessage').textContent = message;
      popup.hidden = false;
    }

    function resetAfterPopup() {
      document.getElementById('popup').hidden = true;
      selectedParticipant = null;
      idInput.value = '';
      card.hidden = true;
      showStatus('Scan a QR Code or enter a Participant ID.');
      idInput.focus();
    }

    function normalize(value) {
      return String(value || '').trim().toLocaleLowerCase().replace(/\s+/g, ' ');
    }
  </script>
</body>
</html>
