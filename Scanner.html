<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Participant Scanner</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root {
      --bg:#0f172a;
      --card:#ffffff;
      --text:#172033;
      --muted:#667085;
      --primary:#155eef;
      --primary-dark:#004eeb;
      --success:#079455;
      --danger:#d92d20;
      --border:#d0d5dd;
      --shadow:0 18px 50px rgba(0,0,0,.28);
    }
    * { box-sizing:border-box; }
    [hidden] { display:none !important; }
    body {
      margin:0;
      min-height:100vh;
      background:var(--bg);
      font-family:Arial,sans-serif;
      color:var(--text);
      padding:16px;
    }
    .card {
      width:min(620px,100%);
      margin:0 auto;
      background:var(--card);
      border-radius:18px;
      padding:20px;
      box-shadow:var(--shadow);
    }
    h1 { margin:0; font-size:clamp(25px,5vw,34px); text-align:center; }
    .subtitle { margin:8px 0 16px; color:var(--muted); line-height:1.45; text-align:center; }
    #reader {
      width:100%;
      overflow:hidden;
      border-radius:14px;
      background:#000;
      min-height:280px;
    }
    #reader video { object-fit:cover; }
    .camera-fallback { margin-top:12px; }
    .manual-label { display:block; margin:20px 0 8px; font-weight:900; }
    .manual { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:9px; }
    input {
      width:100%;
      min-width:0;
      min-height:58px;
      border:2px solid var(--border);
      border-radius:11px;
      padding:11px 14px;
      font-size:25px;
      font-weight:800;
      letter-spacing:4px;
      text-align:center;
      outline:none;
    }
    input:focus { border-color:var(--primary); box-shadow:0 0 0 4px rgba(21,94,239,.12); }
    .btn {
      min-height:58px;
      border:0;
      border-radius:11px;
      padding:12px 18px;
      font:900 17px Arial,sans-serif;
      cursor:pointer;
      background:var(--primary);
      color:#fff;
      touch-action:manipulation;
    }
    .btn:hover { background:var(--primary-dark); }
    .btn:disabled { opacity:.55; cursor:not-allowed; }
    .btn-full { width:100%; }
    .error { min-height:22px; margin-top:12px; color:#f97066; font-weight:700; line-height:1.4; text-align:center; }
    .small { margin:10px 0 0; color:var(--muted); font-size:12px; line-height:1.4; text-align:center; }

    .modal {
      position:fixed;
      inset:0;
      z-index:100;
      display:grid;
      place-items:center;
      padding:18px;
      background:rgba(15,23,42,.82);
    }
    .modal-card {
      width:min(610px,100%);
      max-height:92vh;
      overflow:auto;
      background:#fff;
      border-radius:18px;
      padding:22px;
      box-shadow:0 24px 70px rgba(0,0,0,.35);
    }
    .modal-title { margin:0; font-size:clamp(29px,6vw,42px); line-height:1.12; text-align:center; }
    .participant-id { margin-top:9px; color:var(--muted); font-size:17px; font-weight:800; text-align:center; }
    .family-title { margin:24px 0 8px; font-size:20px; }
    .family-help { margin:0 0 12px; color:var(--muted); line-height:1.45; }
    .family-list { display:grid; gap:10px; }
    .family-option {
      display:flex;
      gap:13px;
      align-items:center;
      min-height:62px;
      border:1.5px solid var(--border);
      border-radius:12px;
      padding:12px 14px;
      cursor:pointer;
    }
    .family-option input { width:28px; height:28px; min-height:0; flex:0 0 auto; accent-color:var(--success); box-shadow:none; }
    .family-option span { font-size:19px; font-weight:800; line-height:1.35; }
    .no-family { padding:15px; border-radius:11px; background:#f9fafb; color:var(--muted); text-align:center; }
    .modal-actions { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:22px; }
    .btn-light { background:#fff; color:var(--text); border:1.5px solid var(--border); }
    .btn-light:hover { background:#f9fafb; }

    .result-modal.success { background:rgba(7,148,85,.96); }
    .result-modal.duplicate,
    .result-modal.error-state { background:rgba(217,45,32,.96); }
    .result-card { background:transparent; color:#fff; box-shadow:none; text-align:center; }
    .result-name { margin:0 0 12px; font-size:clamp(25px,5vw,38px); font-weight:900; }
    .result-title { margin:0; font-size:clamp(38px,9vw,72px); line-height:1.02; text-transform:uppercase; }
    .result-message { margin:18px auto 0; max-width:560px; font-size:18px; font-weight:700; line-height:1.5; }
    .result-close {
      min-width:200px;
      margin-top:26px;
      min-height:58px;
      border:2px solid #fff;
      border-radius:11px;
      background:#fff;
      color:#172033;
      font-size:18px;
      font-weight:900;
      cursor:pointer;
    }

    @media (max-width:520px) {
      body { padding:10px; }
      .card { padding:15px; border-radius:15px; }
      #reader { min-height:260px; }
      .manual { grid-template-columns:1fr; }
      .manual .btn { width:100%; }
      .modal { padding:10px; }
      .modal-card { padding:18px 15px; border-radius:15px; }
      .modal-actions { grid-template-columns:1fr; }
      .family-option span { font-size:18px; }
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>PARTICIPANT SCANNER</h1>
    <p class="subtitle">The camera opens automatically. Point it at the participant barcode or QR code.</p>

    <div id="reader"></div>
    <button id="startButton" class="btn btn-full camera-fallback" type="button" hidden>START CAMERA</button>

    <label class="manual-label" for="manualCode">Participant ID</label>
    <div class="manual">
      <input id="manualCode" inputmode="numeric" pattern="[0-9]*" placeholder="12345" maxlength="5" autocomplete="off">
      <button id="manualButton" class="btn" type="button">OPEN</button>
    </div>

    <div id="error" class="error"></div>
    <p class="small">Camera access requires HTTPS. If automatic camera access is blocked by the browser, use START CAMERA.</p>
  </main>

  <div id="participantModal" class="modal" role="dialog" aria-modal="true" hidden>
    <div class="modal-card">
      <h2 id="participantName" class="modal-title"></h2>
      <div id="participantId" class="participant-id"></div>

      <h3 class="family-title">Family Members</h3>
      <p id="familyHelp" class="family-help">Select the family members who are checking in.</p>
      <div id="familyList" class="family-list"></div>

      <div class="modal-actions">
        <button id="participantClose" class="btn btn-light" type="button">CLOSE</button>
        <button id="checkInButton" class="btn" type="button">CHECK-IN</button>
      </div>
    </div>
  </div>

  <div id="resultModal" class="modal result-modal success" role="dialog" aria-modal="true" hidden>
    <div class="modal-card result-card">
      <p id="resultName" class="result-name"></p>
      <h2 id="resultTitle" class="result-title">CHECK IN SUCCESS</h2>
      <p id="resultMessage" class="result-message"></p>
      <button id="resultClose" class="result-close" type="button">CLOSE</button>
    </div>
  </div>

  <script>
    // IMPORTANT: Replace this with the deployed Apps Script /exec URL.
    // Example: https://script.google.com/macros/s/AKfycb.../exec
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz0QKnCmiB0GEuHGspWmtdblh_I-_K_2tmWG9GI1VCBpenQAXhozOAj0UaB6f2yeieb/exec';

    let scanner = null;
    let cameraStarted = false;
    let scanLocked = false;
    let currentParticipant = null;
    let jsonpSequence = 0;

    const reader = document.getElementById('reader');
    const startButton = document.getElementById('startButton');
    const manualCode = document.getElementById('manualCode');
    const manualButton = document.getElementById('manualButton');
    const participantModal = document.getElementById('participantModal');
    const participantClose = document.getElementById('participantClose');
    const checkInButton = document.getElementById('checkInButton');
    const resultModal = document.getElementById('resultModal');
    const resultClose = document.getElementById('resultClose');

    window.addEventListener('load', () => {
      if (!isConfigured()) {
        setError('Update APPS_SCRIPT_URL in Scanner.html with your deployed Apps Script /exec URL.');
        startButton.hidden = false;
        startButton.disabled = true;
        manualButton.disabled = true;
        return;
      }
      startScanner();
    });

    startButton.addEventListener('click', startScanner);
    manualButton.addEventListener('click', () => openParticipant(manualCode.value));
    manualCode.addEventListener('keydown', event => {
      if (event.key === 'Enter') {
        event.preventDefault();
        openParticipant(manualCode.value);
      }
    });
    manualCode.addEventListener('input', () => {
      manualCode.value = manualCode.value.replace(/\D/g, '').slice(0, 5);
    });

    participantClose.addEventListener('click', closeParticipantModal);
    checkInButton.addEventListener('click', submitCheckIn);
    resultClose.addEventListener('click', closeResultModal);

    function isConfigured() {
      try {
        const url = new URL(APPS_SCRIPT_URL);
        return url.protocol === 'https:' &&
          url.hostname === 'script.google.com' &&
          url.pathname.startsWith('/macros/s/') &&
          /\/exec$/.test(url.pathname) &&
          !url.pathname.includes('REPLACE_WITH_YOUR_DEPLOYMENT_ID');
      } catch (error) {
        return false;
      }
    }

    async function startScanner() {
      if (!isConfigured() || cameraStarted) return;
      setError('');
      startButton.hidden = true;
      startButton.disabled = true;

      try {
        scanner = new Html5Qrcode('reader', {
          formatsToSupport: [
            Html5QrcodeSupportedFormats.CODE_128,
            Html5QrcodeSupportedFormats.QR_CODE
          ]
        });

        await scanner.start(
          { facingMode: 'environment' },
          {
            fps: 12,
            qrbox: (viewfinderWidth, viewfinderHeight) => {
              const width = Math.min(viewfinderWidth - 30, 430);
              return { width: Math.max(220, width), height: Math.min(180, viewfinderHeight - 30) };
            },
            aspectRatio: 1.333333
          },
          decodedText => {
            if (!scanLocked) openParticipant(decodedText);
          },
          () => {}
        );
        cameraStarted = true;
      } catch (error) {
        cameraStarted = false;
        startButton.hidden = false;
        startButton.disabled = false;
        setError('Unable to start the camera automatically. Tap START CAMERA or enter the Participant ID below.');
      }
    }

    function normalizeScannedCode(value) {
      let code = String(value || '').trim();
      if (/^HUTRI81:/i.test(code)) code = code.replace(/^HUTRI81:/i, '');
      const digitMatch = code.match(/\d{5,6}/);
      return digitMatch ? digitMatch[0] : code.replace(/[^A-Za-z0-9-]/g, '');
    }

    async function openParticipant(rawCode) {
      if (scanLocked) return;
      const participantId = normalizeScannedCode(rawCode);
      if (!participantId) return;

      scanLocked = true;
      setError('');
      manualButton.disabled = true;

      try {
        const result = await jsonpRequest({ api: 'participant', participantId });
        if (!result || !result.success || !result.participant) {
          throw new Error(result && result.error ? result.error : 'Participant ID was not found.');
        }

        currentParticipant = result.participant;
        if (currentParticipant.checkedIn) {
          showResult('duplicate', currentParticipant.name, 'ALREADY CHECKED IN', 'This participant has already checked in.');
          return;
        }

        renderParticipantModal(currentParticipant);
        participantModal.hidden = false;
        checkInButton.focus();
      } catch (error) {
        showResult('error-state', 'ERROR', 'PARTICIPANT NOT FOUND', error && error.message ? error.message : String(error));
      } finally {
        manualButton.disabled = false;
      }
    }

    function renderParticipantModal(participant) {
      document.getElementById('participantName').textContent = participant.name || 'PARTICIPANT';
      document.getElementById('participantId').textContent = 'Participant ID: ' + (participant.participantId || '');

      const familyList = document.getElementById('familyList');
      const familyHelp = document.getElementById('familyHelp');
      familyList.replaceChildren();

      const members = Array.isArray(participant.familyList) ? participant.familyList : [];
      if (!members.length) {
        familyHelp.hidden = true;
        const none = document.createElement('div');
        none.className = 'no-family';
        none.textContent = 'No family members registered.';
        familyList.appendChild(none);
      } else {
        familyHelp.hidden = false;
        members.forEach((member, index) => {
          const label = document.createElement('label');
          label.className = 'family-option';

          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.value = member;
          checkbox.id = 'family-member-' + index;

          const text = document.createElement('span');
          text.textContent = member;
          label.append(checkbox, text);
          familyList.appendChild(label);
        });
      }
    }

    async function submitCheckIn() {
      if (!currentParticipant) return;
      checkInButton.disabled = true;
      checkInButton.textContent = 'SAVING…';

      const selectedFamilyMembers = Array.from(
        document.querySelectorAll('#familyList input[type="checkbox"]:checked')
      ).map(input => input.value);

      try {
        const result = await jsonpRequest({
          api: 'checkin',
          participantId: currentParticipant.participantId,
          family: JSON.stringify(selectedFamilyMembers)
        });

        participantModal.hidden = true;

        if (result && result.duplicate) {
          currentParticipant = result.participant || currentParticipant;
          showResult('duplicate', currentParticipant.name, 'ALREADY CHECKED IN', 'This participant has already checked in.');
          return;
        }
        if (!result || !result.success) {
          throw new Error(result && result.error ? result.error : 'Check-in could not be completed.');
        }

        currentParticipant = result.participant || currentParticipant;
        showResult('success', currentParticipant.name, 'CHECK IN SUCCESS', '');
      } catch (error) {
        participantModal.hidden = true;
        showResult('error-state', 'ERROR', 'CHECK-IN FAILED', error && error.message ? error.message : String(error));
      } finally {
        checkInButton.disabled = false;
        checkInButton.textContent = 'CHECK-IN';
      }
    }

    function showResult(stateClass, name, title, message) {
      resultModal.className = 'modal result-modal ' + stateClass;
      document.getElementById('resultName').textContent = name || '';
      document.getElementById('resultTitle').textContent = title || '';
      const messageElement = document.getElementById('resultMessage');
      messageElement.textContent = message || '';
      messageElement.hidden = !message;
      resultModal.hidden = false;
      resultClose.focus();
    }

    function closeParticipantModal() {
      participantModal.hidden = true;
      resetScannerState();
    }

    function closeResultModal() {
      resultModal.hidden = true;
      resultModal.className = 'modal result-modal success';
      resetScannerState();
    }

    function resetScannerState() {
      currentParticipant = null;
      manualCode.value = '';
      scanLocked = false;
      setError('');
      manualCode.focus();
    }

    function jsonpRequest(params) {
      return new Promise((resolve, reject) => {
        const callbackName = '__scannerJsonp' + Date.now() + '_' + (++jsonpSequence);
        const script = document.createElement('script');
        const url = new URL(APPS_SCRIPT_URL);
        Object.keys(params || {}).forEach(key => url.searchParams.set(key, params[key]));
        url.searchParams.set('callback', callbackName);

        const timeout = setTimeout(() => cleanup(new Error('The server did not respond. Please try again.')), 15000);

        function cleanup(error, data) {
          clearTimeout(timeout);
          try { delete window[callbackName]; } catch (ignored) { window[callbackName] = undefined; }
          script.remove();
          if (error) reject(error);
          else resolve(data);
        }

        window[callbackName] = data => cleanup(null, data);
        script.onerror = () => cleanup(new Error('Unable to connect to the check-in server.'));
        script.src = url.toString();
        document.head.appendChild(script);
      });
    }

    function setError(message) {
      document.getElementById('error').textContent = message || '';
    }
  </script>
</body>
</html>
